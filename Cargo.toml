[package]
name = "drocsid"
version = "0.3.0"
edition = "2021"
description = "VersÃ£o simplificada do Discord em Rust com voz, chat e compartilhamento de tela (WebRTC + Captura Nativa inspirada no discord_voice.node)"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
jpeg-encoder = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
